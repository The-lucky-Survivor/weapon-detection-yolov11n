# data_v2.yaml — Dataset configuration for Stage 2 (fine-tuning)
# Used with: src/train_v2.py
#
# dataset_v2 is an extended version of dataset_v1 with additional annotated samples.
# Place this repository's root as your working directory when training,
# OR provide the absolute path to this file via --data.

path: datasets/dataset_v2   # dataset root dir (relative to repo root)
train: images/train
val:   images/val
test:  images/test

nc: 3
names: ['knife', 'pistol', 'rifle']
